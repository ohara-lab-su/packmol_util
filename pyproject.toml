[build-system]
requires = ["setuptools>=71.0","coloredlogs"]
build-backend = "setuptools.build_meta"

[project]
name = "packmol-util"
version = "0.2.10"

description = "Python toolkit for amorphous structure generation using Packmol, with VASP and RMC_POT support."
authors = [
    { name="Kengo NAKADA", email="kengo.nakada@email.com" },
]
readme = "README.md"
# requires-python = ">=3.8"
requires-python = ">=3.10"
dependencies = [
    #"x_logger",
    "xlogger-py",
    #
    "dataclasses",
    "coloredlogs",
    "colorlog",
    #
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "toml",
    # "grpcio",
    "nest_asyncio",
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py"
]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/packmol_util/en/"
Documentation = "https://ohara-lab-su.github.io/packmol_util/en/"
Repository = "https://github.com/ohara-lab-su/packmol_util"
Issues = "https://github.com/ohara-lab-su/packmol_util/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[project.scripts]
packmol_util = "packmol_util.install:main"

[tool.setuptools.data-files]
"share/packmol_util/scripts" = [
    "scripts/config.yml",
    "scripts/make_amorphous_random.py",
    "scripts/make_cell_size.py",
    "scripts/make_mass_density.py",
    "scripts/make_number_density.py",
]
"share/packmol_util/example/FeSiB" = [
    "example/FeSiB/B.xyz",
    "example/FeSiB/Fe.xyz",
    "example/FeSiB/FeSiB_packmol.inp",
    "example/FeSiB/FeSiB_packmol.log",
    "example/FeSiB/FeSiB_packmol.xyz",
    "example/FeSiB/POSCAR",
    "example/FeSiB/POSCAR.vasp",
    "example/FeSiB/Si.xyz",
    "example/FeSiB/make_FeSiB.py",
]
"share/packmol_util/example/FeSiB/non_bulder" = [
    "example/FeSiB/non_bulder/make_FeSiB.py",
]
"share/packmol_util/example/Li3PO4" = [
    "example/Li3PO4/Li.xyz",
    "example/Li3PO4/PO4.xyz",
    "example/Li3PO4/POSCAR",
    "example/Li3PO4/POSCAR.vasp",
    "example/Li3PO4/li3po4_packmol.inp",
    "example/Li3PO4/li3po4_packmol.log",
    "example/Li3PO4/li3po4_packmol.xyz",
    "example/Li3PO4/make_Li3PO4.py",
]
"share/packmol_util/example/Li3PO4/non_builder" = [
    "example/Li3PO4/non_builder/make_Li3PO4.py",
]
