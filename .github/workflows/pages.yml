name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Do NOT install packmol_util here.  The project has runtime-only/private
      # dependencies (for example x_logger) that are irrelevant to API docs.
      # pydoctor reads the Python source statically, so API generation does not
      # import packmol_util and does not resolve its runtime dependencies.
      - name: Install API documentation generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydoctor

      - name: Generate API reference from source
        run: |
          rm -rf docs/api
          python -m pydoctor \
            --project-name=packmol_util \
            --project-base-dir=. \
            --html-output=docs/api \
            --make-html \
            src/packmol_util

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
