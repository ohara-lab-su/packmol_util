name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        run: python -m pip install sphinx

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build handwritten Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Generate API documentation automatically
        shell: bash
        run: |
          rm -rf /tmp/packmol-api /tmp/packmol-api-html
          mkdir -p /tmp/packmol-api

          cat > /tmp/packmol-api/conf.py <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "src"))

          project = "packmol_util"
          extensions = [
              "sphinx.ext.autodoc",
              "sphinx.ext.napoleon",
          ]
          autodoc_mock_imports = ["x_logger", "yaml"]
          autodoc_default_options = {
              "members": True,
              "undoc-members": True,
              "show-inheritance": True,
          }
          napoleon_google_docstring = True
          napoleon_numpy_docstring = False
          html_theme = "alabaster"
          PY

          python -m sphinx.ext.apidoc \
            --force \
            --separate \
            --module-first \
            --output-dir /tmp/packmol-api \
            src/packmol_util

          python -m sphinx \
            -b html \
            /tmp/packmol-api \
            /tmp/packmol-api-html

      - name: Add API documentation to Pages
        shell: bash
        run: |
          mkdir -p _site/api
          cp -a /tmp/packmol-api-html/. _site/api/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
