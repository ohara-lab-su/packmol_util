name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install sphinx

      - name: Generate API documentation
        run: |
          rm -rf /tmp/packmol-api /tmp/packmol-api-html
          mkdir -p /tmp/packmol-api

          python -m sphinx.ext.apidoc \
            -o /tmp/packmol-api \
            src/packmol_util \
            --force \
            --module-first

          cat > /tmp/packmol-api/index.rst <<'RST'
          API Reference
          =============

          .. toctree::
             :maxdepth: 2

             modules
          RST

          cat > /tmp/packmol-api/conf.py <<PY
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("${GITHUB_WORKSPACE}") / "src"))

          project = "packmol_util"
          extensions = [
              "sphinx.ext.autodoc",
              "sphinx.ext.napoleon",
          ]
          napoleon_google_docstring = True
          napoleon_numpy_docstring = False
          autodoc_mock_imports = ["x_logger", "yaml"]
          html_theme = "alabaster"
          PY

          python -m sphinx \
            -b html \
            /tmp/packmol-api \
            /tmp/packmol-api-html

      - name: Prepare Pages source
        run: |
          rm -rf pages-source pages-site
          mkdir -p pages-source
          cp -a docs/. pages-source/

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages-source
          destination: ./pages-site

      - name: Merge API documentation
        run: |
          sudo mkdir -p pages-site/api
          sudo cp -a /tmp/packmol-api-html/. pages-site/api/
          sudo chown -R "$(id -u):$(id -g)" pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
